[defaults]
inventory = inventory.yml
forks = 15
timeout = 20
stdout_callback = yaml
interpreter_python = auto_silent
retry_files_enabled = False

# These are NAT'd IoT gateways: several share one public IP on different
# forwarded ports, and they get reimaged (new host key) in the field. With
# strict checking every reimaged unit halts the run on a prompt.
# TRADEOFF: this disables SSH MITM protection. To re-enable, set True and
# seed known_hosts -- OpenSSH keys by [host]:port, so shared IPs are fine.
host_key_checking = False

[ssh_connection]
pipelining = True
# Cellular links are slow to hand shake; keep the master open between tasks.
ssh_args = -o ControlMaster=auto -o ControlPersist=120s -o ConnectTimeout=15
